name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Unzip project
        run: unzip GestureControl.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download MediaPipe model
        run: |
          mkdir -p GestureControl/app/src/main/assets
          curl -L "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o GestureControl/app/src/main/assets/hand_landmarker.task

      - name: Make gradlew executable
        run: |
          cd GestureControl
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd GestureControl
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: GestureControl-debug
          path: GestureControl/app/build/outputs/apk/debug/app-debug.apk
